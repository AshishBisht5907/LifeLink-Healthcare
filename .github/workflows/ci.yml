name: LifeLink CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check migration files
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          DJANGO_API_URL: http://127.0.0.1:8000
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start > /tmp/lifelink-next.log 2>&1 &
          echo $! > /tmp/lifelink-next.pid
        env:
          DJANGO_API_URL: http://127.0.0.1:8000
      - name: Wait for production server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lifelink-next.log
          exit 1
      - name: Run Playwright browser smoke test
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000

  management-patient-access-e2e:
    name: Management patient-access browser E2E (real Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: apps/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Migrate real Django test database
        run: python manage.py migrate --noinput
        working-directory: apps/backend
        env:
          USE_SQLITE: "true"
          DEBUG: "true"
          SECRET_KEY: "ci-only-secret-key-for-lifelink-e2e"
      - name: Seed synthetic patient, Management, and hospital care records
        run: python manage.py shell -c "$(cat ../../.github/scripts/seed_management_patient_access_e2e.py)"
        working-directory: apps/backend
        env:
          USE_SQLITE: "true"
          DEBUG: "true"
          SECRET_KEY: "ci-only-secret-key-for-lifelink-e2e"
          E2E_STAFF_PASSWORD: "e2e-ci-only-password"
      - name: Start Django with mock OTP provider
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/lifelink-django-e2e.log 2>&1 &
          echo $! > /tmp/lifelink-django-e2e.pid
        working-directory: apps/backend
        env:
          USE_SQLITE: "true"
          DEBUG: "true"
          SECRET_KEY: "ci-only-secret-key-for-lifelink-e2e"
          OTP_PROVIDER: mock
          OTP_DEV_MODE: "true"
          E2E_STAFF_PASSWORD: "e2e-ci-only-password"
      - name: Wait for Django
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/auth/me/ || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 2
          done
          cat /tmp/lifelink-django-e2e.log
          exit 1
      - name: Build frontend
        run: npm run build
        working-directory: apps/web
        env:
          DJANGO_API_URL: http://127.0.0.1:8000
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start production frontend
        run: |
          npm run start > /tmp/lifelink-next-e2e.log 2>&1 &
          echo $! > /tmp/lifelink-next-e2e.pid
        working-directory: apps/web
        env:
          DJANGO_API_URL: http://127.0.0.1:8000
      - name: Wait for frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/lifelink-next-e2e.log
          exit 1
      - name: Run Management -> patient approval -> profile E2E
        run: npm run test:management-access
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:3000
          E2E_STAFF_PASSWORD: "e2e-ci-only-password"
          E2E_PATIENT_PROFILE_ID: ${{ env.E2E_PATIENT_PROFILE_ID }}
          E2E_PATIENT_PHONE: ${{ env.E2E_PATIENT_PHONE }}
          E2E_PATIENT_LIFELINK_ID: ${{ env.E2E_PATIENT_LIFELINK_ID }}
